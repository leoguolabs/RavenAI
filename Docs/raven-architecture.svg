      <text x="72" y="336" class="body" text-anchor="start">Electron / React · MCP 客户端</text>
      <text x="72" y="351" class="code" text-anchor="start">Chaterm SSH · DeviceLinkClient</text>
      <rect x="448" y="192" width="456" height="168" rx="6" class="focal"/>
      <text x="464" y="217" class="label" text-anchor="start">FastAPI 服务</text>
      <text x="464" y="243" class="body" text-anchor="start">REST · 对话、日志暂存、软件包管理</text>
      <text x="464" y="260" class="code" text-anchor="start">/api/v1/ai-chat  ·  /api/v1/logs  ·  /raven/api</text>
      <line x1="464" y1="276" x2="888" y2="276" class="line"/>
      <text x="464" y="300" class="name" text-anchor="start">设备联动 · WebSocket 反向通道</text>
      <text x="464" y="318" class="code" text-anchor="start">/ws/device-link  ·  :8085</text>
      <text x="464" y="341" class="body" text-anchor="start">心跳与断线重连 · 设备侧无需开放入站端口</text>
