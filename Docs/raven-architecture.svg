      #raven-architecture-root .code { font: 9px 'Geist Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; fill: #426454; }
      #raven-architecture-root .gold { fill: #80601B; }
      #raven-architecture-root .route-label { font-size: 8px; font-weight: 600; letter-spacing: .08em; fill: #426454; }
      #raven-architecture-root .route-label-zh { font-size: 12px; font-weight: 600; fill: #426454; }
      #raven-architecture-root .arrow { stroke: #426454; stroke-width: 1.25; fill: none; }
      #raven-architecture-root .dashed { stroke-dasharray: 5 4; }</style>
