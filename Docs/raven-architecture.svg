<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="raven-architecture-title raven-architecture-desc" font-family="'Geist', 'Inter', system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#1A4A3A" id="raven-architecture-root">
      <title id="raven-architecture-title">RavenAI 系统架构</title>
      <desc id="raven-architecture-desc">Vue 与 Electron 客户端通过 REST 或设备联动连接 FastAPI，服务端运行 Agent 和 Celery 任务并访问模型、数据与 Git。</desc>
      <defs>
