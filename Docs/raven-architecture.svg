      <rect width="960" height="600" fill="url(#raven-architecture-raven-architecture-grain)"/>
      <text x="40" y="47" class="figure-kicker" text-anchor="start">系统概览</text>
      <text x="920" y="47" class="figure-kicker" text-anchor="end">RavenAI  /  03</text>
      <text x="40" y="83" class="heading" text-anchor="start">RavenAI 系统架构</text>
      <text x="40" y="111" class="body" text-anchor="start">桌面端和 Web 端接入 RavenAIService，由服务端运行 Agent 并调度后台任务。</text>
