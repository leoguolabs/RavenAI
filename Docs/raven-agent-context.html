<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 上下文如何组装 · RavenAI</title>
  <style>
    body { margin: 0; padding: 24px; background: #FDFBF7; }

    @media print {
      body { padding: 0; }

</head>
<body>
  <main>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Agent 上下文如何组装">
    <svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="raven-agent-context-title raven-agent-context-desc" font-family="'Geist', 'Inter', system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#1A4A3A">
      <title id="raven-agent-context-title">Agent 上下文如何组装</title>
      <desc id="raven-agent-context-desc">系统在运行前根据 Agent 和项目配置准备提示词、Skill，并按任务需要提供源码仓库和任务文件。</desc>
      <defs>
        <style>

      <rect x="0" y="0" width="960" height="600" rx="0" class="paper"/>
      <rect width="960" height="600" fill="url(#raven-agent-context-grain)"/>

      <text x="920" y="47" class="figure-kicker" text-anchor="end">RavenAI  /  04</text>
      <text x="40" y="83" class="heading" text-anchor="start">Agent 上下文如何组装</text>
      <text x="40" y="111" class="body" text-anchor="start">在支持相应能力的 Agent 启动前，系统组装 Agent 默认配置与项目输入。</text>

      <text x="56" y="298" class="code" text-anchor="start">data/agent_skills/</text>

      <text x="56" y="411" class="code" text-anchor="start">data/project_prompts/</text>
      <text x="56" y="426" class="code" text-anchor="start">data/project_skills/</text>
      <text x="56" y="441" class="body" text-anchor="start">项目仓库与访问凭据</text>
      <rect x="264" y="204" width="184" height="264" rx="6" class="focal"/>

      <text x="280" y="290" class="body" text-anchor="start">基础提示词、项目追加段</text>

      <text x="280" y="364" class="body" text-anchor="start">同名时以项目级为准</text>
      <line x1="280" y1="380" x2="432" y2="380" class="line"/>
      <text x="280" y="404" class="name" text-anchor="start">准备项目仓库</text>
      <text x="280" y="424" class="body" text-anchor="start">按需克隆或复用</text>
      <rect x="480" y="204" width="224" height="264" rx="6" class="box"/>

      <text x="496" y="270" class="name" text-anchor="start">系统提示词</text>
      <text x="496" y="290" class="body" text-anchor="start">传入 Agent 运行时</text>

      <text x="496" y="344" class="code" text-anchor="start">.claude/skills/&lt;name&gt;/</text>
      <text x="496" y="364" class="body" text-anchor="start">供 SDK 加载</text>
      <line x1="496" y1="380" x2="688" y2="380" class="line"/>
      <text x="496" y="404" class="code" text-anchor="start">repo/  ·  task.json  ·  logs/</text>
      <text x="496" y="424" class="body" text-anchor="start">按任务需要准备</text>

      <text x="768" y="273" class="name" text-anchor="start">Claude Agent SDK</text>

      <text x="768" y="314" class="body" text-anchor="start">DeviceAgent</text>
      <text x="768" y="333" class="body" text-anchor="start">ProjectExpertAgent</text>
      <text x="768" y="352" class="body" text-anchor="start">PackageSearchAgent</text>
      <text x="768" y="371" class="body" text-anchor="start">LogAnalysisAgent</text>
      <text x="768" y="390" class="body" text-anchor="start">BugFixAgent</text>

      <text x="480" y="519" class="label" text-anchor="start">缺陷修复任务</text>
      <text x="480" y="541" class="body" text-anchor="start">独立修复任务可创建修复分支，交由人工评审。</text>
      <line x1="40" y1="564" x2="920" y2="564" class="line"/>
      <text x="40" y="583" class="meta" text-anchor="start">实线箭头  ·  上下文传至下一阶段</text>
      <text x="920" y="583" class="meta" text-anchor="end">工作区内容取决于 Agent 和任务</text>
