<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="raven-testing-manual-title raven-testing-manual-desc" font-family="'Geist', 'Inter', system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#1A4A3A" id="raven-testing-manual-root">
      <title id="raven-testing-manual-title">人工研发测试</title>
      <desc id="raven-testing-manual-desc">八个步骤串联代码提交、发布说明、软件包交接、设备测试和日志分析，再回到研发修复。</desc>
      <defs>
      <style>#raven-testing-manual-root .diagram-container { overflow-x: auto; }
      #raven-testing-manual-root .diagram-container:focus-visible { outline: 2px solid #80601B; outline-offset: 2px; }
      #raven-testing-manual-root .diagram-container { overflow-x: visible; }
      #raven-testing-manual-root .paper { fill: #FDFBF7; }
      #raven-testing-manual-root .section { fill: #F7F6EF; stroke: #D5DDD1; }
      #raven-testing-manual-root .box { fill: #FDFBF7; stroke: #B7C4B7; }
      #raven-testing-manual-root .focal { fill: #F6EDCF; stroke: #80601B; }
      #raven-testing-manual-root .external { fill: #FDFBF7; stroke: #426454; stroke-dasharray: 4 3; }
      #raven-testing-manual-root .line { stroke: #D5DDD1; }
      #raven-testing-manual-root .heading { font-size: 28px; font-weight: 600; }
      #raven-testing-manual-root .label { font-size: 14px; font-weight: 600; }
      #raven-testing-manual-root .name { font-size: 12px; font-weight: 600; }
      #raven-testing-manual-root .body { font-size: 12px; fill: #426454; }
      #raven-testing-manual-root .figure-kicker { font-size: 10px; font-weight: 600; letter-spacing: .10em; fill: #426454; }
      #raven-testing-manual-root .meta { font-size: 11px; fill: #426454; }
      #raven-testing-manual-root .code { font: 9px 'Geist Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; fill: #426454; }
      #raven-testing-manual-root .gold { fill: #80601B; }
      #raven-testing-manual-root .route-label { font-size: 8px; font-weight: 600; letter-spacing: .08em; fill: #426454; }
      #raven-testing-manual-root .route-label-zh { font-size: 12px; font-weight: 600; fill: #426454; }
      #raven-testing-manual-root .arrow { stroke: #426454; stroke-width: 1.25; fill: none; }
      #raven-testing-manual-root .dashed { stroke-dasharray: 5 4; }</style>
        <style>
      .paper { fill: #FDFBF7; }
