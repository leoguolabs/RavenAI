      <text x="284" y="261" class="body" text-anchor="start">反复沟通变更内容</text>
      <rect x="496" y="188" width="196" height="96" rx="6" class="box"/>
      <text x="512" y="212" class="figure-kicker" text-anchor="start">03</text>
      <text x="512" y="239" class="name" text-anchor="start">交接软件包</text>
      <text x="512" y="261" class="body" text-anchor="start">容易交错版本</text>
      <rect x="724" y="188" width="196" height="96" rx="6" class="box"/>
      <text x="740" y="212" class="figure-kicker" text-anchor="start">04</text>
      <text x="740" y="239" class="name" text-anchor="start">查找软件包</text>
      <text x="740" y="261" class="body" text-anchor="start">测试人员核对构建版本</text>
      <rect x="724" y="360" width="196" height="96" rx="6" class="box"/>
      <text x="740" y="384" class="figure-kicker" text-anchor="start">05</text>
      <text x="740" y="411" class="name" text-anchor="start">手动操作设备</text>
      <text x="740" y="433" class="body" text-anchor="start">依赖设备操作经验</text>
      <rect x="496" y="360" width="196" height="96" rx="6" class="box"/>
      <text x="512" y="384" class="figure-kicker" text-anchor="start">06</text>
      <text x="512" y="411" class="name" text-anchor="start">收集分散日志</text>
      <text x="512" y="433" class="body" text-anchor="start">手工汇集多处日志</text>
      <rect x="268" y="360" width="196" height="96" rx="6" class="box"/>
      <text x="284" y="384" class="figure-kicker" text-anchor="start">07</text>
      <text x="284" y="411" class="name" text-anchor="start">人工排查日志</text>
      <text x="284" y="433" class="body" text-anchor="start">故障定位耗时</text>
      <rect x="40" y="360" width="196" height="96" rx="6" class="box"/>
      <text x="56" y="384" class="figure-kicker" text-anchor="start">08</text>
      <text x="56" y="411" class="name" text-anchor="start">修复问题</text>
      <text x="56" y="433" class="body" text-anchor="start">研发人员准备修复</text>
      <line x1="40" y1="488" x2="920" y2="488" class="line"/>
      <text x="40" y="519" class="label" text-anchor="start">软件包交接</text>
      <text x="40" y="541" class="body" text-anchor="start">研发和测试人员需要确认实际使用的构建版本。</text>
      <text x="488" y="519" class="label" text-anchor="start">故障定位</text>
      <text x="488" y="541" class="body" text-anchor="start">测试人员需要从分散的日志中还原问题。</text>
      <line x1="40" y1="564" x2="920" y2="564" class="line"/>
